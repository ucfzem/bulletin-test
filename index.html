<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Générateur de bulletin scolaire mobile FR/AR — UCF ZEM">
<title>Générateur de Bulletin — UCF ZEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" defer></script>
<style>
  :root {
    --bg: #12181b; --paper: #1a232a; --surface: #24303a;
    --ink: #f0f4f8; --muted: #8b9bb0; --line: #2d3d4c;
    --gold: #d4a84a; --gold-light: #f3e5ab; --emerald: #10b981;
    --emerald-dark: #064e3b; --accent: #ef4444; --radius: 14px;
    --focus-ring: 0 0 0 3px rgba(16, 185, 129, 0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; font-family: 'Inter', sans-serif; color: var(--ink);
    background: var(--bg); padding: 12px 10px 80px; min-height: 100vh;
  }

  .wrap { max-width: 600px; margin: 0 auto; }

  /* Accessibilité : focus visible & saut de navigation */
  .skip-link {
    position: absolute; top: -40px; left: 8px; z-index: 100;
    background: var(--emerald); color: #fff; padding: 8px 12px;
    border-radius: 6px; text-decoration: none; font-size: 12px;
  }
  .skip-link:focus { top: 8px; }

  :focus-visible {
    outline: 2px solid var(--emerald);
    outline-offset: 2px;
    box-shadow: var(--focus-ring);
  }

  button:focus:not(:focus-visible) { outline: none; }

  [hidden] { display: none !important; }

  .topbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .header-info h1 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; margin: 0; color: #fff; }
  .header-info span { font-size: 11px; color: var(--muted); }

  .action-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .btn {
    border: none; border-radius: 10px; padding: 10px 8px; font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 4px; text-align: center; color: #fff;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.55; cursor: wait; }
  .btn-primary { background: var(--emerald); }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-lang { background: var(--surface); border: 1px solid var(--line); padding: 6px; }
  .btn-lang.active { background: var(--emerald); border-color: var(--emerald); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  .card {
    background: var(--paper); border-radius: var(--radius); border: 1px solid var(--line);
    padding: 14px; margin-bottom: 12px;
  }
  .card-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--gold);
    margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; color: var(--muted); font-weight: 600; }
  .field input, .field select, .field textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-family: 'Inter', sans-serif; background: var(--surface); color: var(--ink); width: 100%;
  }
  .field input.ar { font-family: 'Tajawal', sans-serif; direction: rtl; }
  .field textarea.ar { font-family: 'Tajawal', sans-serif; direction: rtl; }
  .field select option { background: var(--surface); color: var(--ink); }

  .unit-title {
    background: var(--surface); font-size: 11px; font-weight: 700; color: var(--emerald);
    padding: 6px 10px; border-radius: 6px; margin: 10px 0 6px; display: flex; justify-content: space-between;
  }
  .subj-item {
    display: grid; grid-template-columns: 1fr 65px 45px; gap: 6px; align-items: center; margin-bottom: 6px;
  }
  .subj-item label { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subj-item label.ar { font-family: 'Tajawal', sans-serif; direction: rtl; text-align: right; }
  .subj-item input {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px; font-size: 12px;
    text-align: center; background: var(--surface); color: var(--ink);
  }
  .subj-item input::placeholder { color: var(--muted); font-size: 10px; }

  .mobile-card-header {
    background: linear-gradient(135deg, var(--emerald-dark), var(--paper));
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
  }
  .m-header-top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 8px; }
  .m-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; }
  .m-info-box { background: rgba(0,0,0,0.2); padding: 6px 8px; border-radius: 6px; }
  .m-info-box span { display: block; font-size: 9px; color: var(--muted); }
  .m-avg-box {
    margin-top: 10px; background: var(--emerald); padding: 8px 10px; border-radius: 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .m-avg-box span { font-size: 11px; font-weight: bold; }
  .m-avg-box strong { font-size: 16px; }

  .mobile-unit {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; margin-bottom: 8px;
  }
  .m-unit-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 11px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 6px; }
  .m-subj-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; }
  .m-subj-bar { height: 4px; background: var(--surface); border-radius: 2px; width: 100%; margin-top: 2px; overflow: hidden; }
  .m-subj-fill { height: 100%; background: var(--gold); }

  #a4-render-container {
    position: fixed; left: 0; top: 0; z-index: -9999;
    opacity: 0; pointer-events: none; width: 210mm;
  }
  .a4-page {
    width: 210mm; height: 296mm; background: #fff; color: #14171f; padding: 10mm;
    font-family: 'Tajawal', 'Inter', sans-serif; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;
  }
  .a4-header { background: #10493f; color: #fff; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; }
  .a4-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; background: rgba(255,255,255,0.1); padding: 6px; border-radius: 6px; font-size: 9px; }
  .a4-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
  .a4-table th, .a4-table td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: center; }
  .a4-table th { background-color: #10493f; color: #fff; font-weight: bold; }
  .a4-table td.num { text-align: right; font-weight: bold; }
  .a4-unit-header td { background-color: #e2e8f0; font-weight: bold; text-align: left; }
  .a4-summary { display: flex; justify-content: space-between; background: #f4f1ea; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 11px; }

  @media print {
    html, body {
      height: auto !important; min-height: 0 !important; margin: 0 !important;
      padding: 0 !important; background: #fff !important;
    }
    body * { visibility: hidden; }
    #a4-render-container, #a4-render-container * { visibility: visible; }
    #a4-render-container {
      position: static !important; /* flux naturel → pagination multi-pages correcte */
      width: 100% !important; margin: 0 !important; padding: 0 !important;
      left: auto !important; top: auto !important;
    }
    .a4-page {
      width: 100% !important; height: 297mm !important; min-height: 0 !important;
      padding: 10mm !important; margin: 0 !important; box-sizing: border-box !important;
      page-break-after: always; break-after: page;
      page-break-inside: avoid; break-inside: avoid;
    }
    .a4-page:last-child { page-break-after: auto; break-after: auto; }
    .a4-page * { margin: 0 !important; padding: 0 !important; }
    .a4-page .a4-header { padding: 8px 10px !important; margin-bottom: 6px !important; }
    .a4-page .a4-grid { padding: 4px 6px !important; margin-bottom: 6px !important; }
    .a4-page .a4-table { margin-top: 4px !important; }
    .a4-page .a4-table th, .a4-page .a4-table td { padding: 2px 4px !important; }
    .a4-page .a4-summary { padding: 6px 8px !important; margin-top: 6px !important; }
    .a4-page .a4-summary * { margin: 0 !important; padding: 0 !important; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Aller au contenu</a>

<div class="wrap" id="main">
  <div class="topbar">
    <div class="header-info">
      <h1 data-i18n="appTitle">📋 Générateur de Bulletin</h1>
      <span data-i18n="appSub">UCF ZEM · Version Mobile</span>
    </div>
    <div class="action-bar" id="lang-bar" role="group" aria-label="Langue"></div>
    <button type="button" class="btn btn-ghost" id="btnAutoFill" data-i18n="autoFill" style="grid-column:1/-1;">✨ Remplir</button>
  </div>

  <div id="form-view">
    <div class="card">
      <h2 class="card-title" data-i18n="generalInfo">🏫 Informations Générales</h2>
      <div class="grid">
        <div class="field">
          <label id="lblSchool" for="inputSchool" data-i18n="school">École</label>
          <input class="ar" id="inputSchool" value="مدرسة ابن سينا" autocomplete="organization">
        </div>
        <div class="field">
          <label id="lblYear" for="year-select" data-i18n="schoolYear">Année Scolaire</label>
          <select id="year-select">
            <option value="2025/2026">2025 / 2026</option>
            <option value="2026/2027" selected>2026 / 2027</option>
            <option value="2027/2028">2027 / 2028</option>
          </select>
        </div>
        <div class="field">
          <label id="lblStudent" for="inputStudent" data-i18n="student">Élève</label>
          <input class="ar" id="inputStudent" value="أحمد بن محمد" autocomplete="name">
        </div>
        <div class="field">
          <label id="lblClass" for="grade-select" data-i18n="class">Classe</label>
          <select id="grade-select">
            <option value="0">1ère Année</option>
            <option value="1">2ème Année</option>
            <option value="2">3ème Année</option>
            <option value="3">4ème Année</option>
            <option value="4">5ème Année</option>
            <option value="5" selected>6ème Année</option>
          </select>
        </div>
        <div class="field">
          <label id="lblNum" for="f-num" data-i18n="regNumber">N° Inscription</label>
          <input id="f-num" value="45 / 12">
        </div>
        <div class="field">
          <label id="lblCount" for="inputCount" data-i18n="classCount">Effectif</label>
          <input type="number" id="inputCount" value="22" min="1" inputmode="numeric">
        </div>
        <div class="field">
          <label id="lblTeachers" for="inputTeachers" data-i18n="teachers">Professeurs</label>
          <input class="ar" id="inputTeachers" value="المرابط · الفاسي">
        </div>
        <div class="field">
          <label id="lblPeriod" for="semester-select" data-i18n="semester">Période</label>
          <select id="semester-select">
            <option value="0">SEMESTRE 1</option>
            <option value="1" selected>SEMESTRE 2</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title" data-i18n="notesCoeff">📊 Notes & Coefficients</h2>
      <div id="units-form"></div>
    </div>

    <div class="card">
      <h2 class="card-title" data-i18n="appreciation">✍️ Appréciation</h2>
      <div class="grid">
        <div class="field">
          <label id="lblRank" for="f-rank" data-i18n="rank">Rang</label>
          <input id="f-rank" value="2ᵉ de la classe">
        </div>
        <div class="field">
          <label id="lblDirector" for="inputDirector" data-i18n="director">Directeur</label>
          <input class="ar" id="inputDirector" value="عبد الله الناصري">
        </div>
        <div class="field grid-full">
          <label id="lblRemark" for="f-remark" data-i18n="remark">Remarque</label>
          <textarea id="f-remark" rows="2">Élève sérieux et travailleur</textarea>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-primary" id="btnPreview" data-i18n="preview" style="width:100%; padding: 14px; font-size:14px;">Afficher l'Aperçu Mobile →</button>
  </div>

  <div id="preview-mobile" hidden>
    <div class="action-bar" style="margin-bottom: 12px;">
      <button type="button" class="btn btn-ghost" id="btnEdit" data-i18n="edit">← Éditer</button>
      <button type="button" class="btn btn-ghost" id="btnPrint" data-i18n="print">🖨️ Imprimer</button>
      <button type="button" class="btn btn-gold" id="btnExport" data-i18n="exportPDF">📄 PDF A4</button>
    </div>
    <div id="mobile-card-render" aria-live="polite"></div>
  </div>
</div>

<div id="a4-render-container" aria-hidden="true">
  <div class="a4-page" id="a4-sheet"></div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
